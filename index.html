<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>JARVIS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #00d4ff; --blue-dim: #0099bb; --blue-glow: rgba(0,212,255,0.4);
    --bg: #030a0f; --grid: rgba(0,212,255,0.04); --text: #c8f0ff; --text-dim: #4a7a8a;
  }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; -webkit-font-smoothing: antialiased; }
  body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 40px 40px; z-index: 0; pointer-events: none; }
  body::after { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 30%, var(--bg) 80%); z-index: 0; pointer-events: none; }
  #app { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding-bottom: 180px; }
  .hud-top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 18px 24px; z-index: 10; }
  .hud-label { font-family: 'Orbitron', monospace; font-size: 9px; letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase; }
  .hud-value { font-family: 'Rajdhani', sans-serif; font-size: 13px; color: var(--blue); letter-spacing: 1px; }
  .hud-corner { display: flex; flex-direction: column; gap: 2px; }
  .corner-tl,.corner-tr,.corner-bl,.corner-br { position: fixed; width: 24px; height: 24px; z-index: 10; opacity: 0.5; }
  .corner-tl { top:8px; left:8px; border-top:1px solid var(--blue); border-left:1px solid var(--blue); }
  .corner-tr { top:8px; right:8px; border-top:1px solid var(--blue); border-right:1px solid var(--blue); }
  .corner-bl { bottom:8px; left:8px; border-bottom:1px solid var(--blue); border-left:1px solid var(--blue); }
  .corner-br { bottom:8px; right:8px; border-bottom:1px solid var(--blue); border-right:1px solid var(--blue); }
  .orb-wrapper { position: relative; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
  .orb-ring-outer { position: absolute; width: 220px; height: 220px; border-radius: 50%; border: 1px dashed rgba(0,212,255,0.2); animation: spin 20s linear infinite; }
  .orb-ring-outer::before { content:''; position:absolute; top:-2px; left:50%; transform:translateX(-50%); width:2px; height:10px; background:var(--blue); opacity:0.8; }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes spin-rev { from{transform:rotate(0deg)} to{transform:rotate(-360deg)} }
  .orb-ring-mid { position:absolute; width:180px; height:180px; border-radius:50%; border:1px solid rgba(0,212,255,0.15); animation:spin-rev 12s linear infinite; }
  .orb-ring-mid::before,.orb-ring-mid::after { content:''; position:absolute; width:6px; height:6px; background:var(--blue); border-radius:50%; box-shadow:0 0 8px var(--blue); }
  .orb-ring-mid::before { top:-3px; left:50%; transform:translateX(-50%); }
  .orb-ring-mid::after  { bottom:-3px; left:50%; transform:translateX(-50%); }
  .orb-glow { position:absolute; width:155px; height:155px; border-radius:50%; border:2px solid var(--blue); box-shadow:0 0 20px var(--blue-glow),0 0 60px var(--blue-glow),inset 0 0 30px rgba(0,212,255,0.08); transition:box-shadow 0.3s,border-color 0.3s; }
  .orb-glow.listening { border-color:#00ffaa; box-shadow:0 0 30px rgba(0,255,170,0.6),0 0 80px rgba(0,255,170,0.3),inset 0 0 40px rgba(0,255,170,0.1); animation:pulse-listen 1s ease-in-out infinite; }
  .orb-glow.speaking  { border-color:#ffaa00; box-shadow:0 0 30px rgba(255,170,0,0.5),0 0 80px rgba(255,170,0,0.2),inset 0 0 40px rgba(255,170,0,0.08); animation:pulse-speak 0.5s ease-in-out infinite; }
  @keyframes pulse-listen { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
  @keyframes pulse-speak  { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  .orb-core { position:absolute; width:120px; height:120px; border-radius:50%; background:radial-gradient(circle at 40% 35%,rgba(0,212,255,0.12) 0%,rgba(0,50,80,0.6) 60%,rgba(3,10,15,0.9) 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .orb-name { font-family:'Orbitron',monospace; font-size:14px; font-weight:700; letter-spacing:4px; color:var(--blue); text-shadow:0 0 20px var(--blue); }
  .orb-status { font-family:'Rajdhani',sans-serif; font-size:10px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; transition:color 0.3s; }
  .orb-status.listening { color:#00ffaa; }
  .orb-status.speaking  { color:#ffaa00; }
  .waveform { display:flex; align-items:center; gap:3px; height:28px; opacity:0; transition:opacity 0.3s; margin-bottom:8px; }
  .waveform.active { opacity:1; }
  .waveform .bar { width:3px; background:var(--blue); border-radius:2px; height:4px; }
  .waveform.listening .bar { background:#00ffaa; }
  .waveform.speaking .bar  { background:#ffaa00; }
  .waveform .bar:nth-child(1)  { animation:wave 0.8s ease-in-out infinite 0.00s; }
  .waveform .bar:nth-child(2)  { animation:wave 0.8s ease-in-out infinite 0.10s; }
  .waveform .bar:nth-child(3)  { animation:wave 0.8s ease-in-out infinite 0.20s; }
  .waveform .bar:nth-child(4)  { animation:wave 0.8s ease-in-out infinite 0.05s; }
  .waveform .bar:nth-child(5)  { animation:wave 0.8s ease-in-out infinite 0.15s; }
  .waveform .bar:nth-child(6)  { animation:wave 0.8s ease-in-out infinite 0.25s; }
  .waveform .bar:nth-child(7)  { animation:wave 0.8s ease-in-out infinite 0.08s; }
  .waveform .bar:nth-child(8)  { animation:wave 0.8s ease-in-out infinite 0.18s; }
  .waveform .bar:nth-child(9)  { animation:wave 0.8s ease-in-out infinite 0.03s; }
  .waveform .bar:nth-child(10) { animation:wave 0.8s ease-in-out infinite 0.13s; }
  .waveform .bar:nth-child(11) { animation:wave 0.8s ease-in-out infinite 0.22s; }
  .waveform .bar:nth-child(12) { animation:wave 0.8s ease-in-out infinite 0.07s; }
  @keyframes wave { 0%,100%{height:4px} 50%{height:22px} }
  .chat-area { width:100%; max-width:500px; padding:0 24px; display:flex; flex-direction:column; align-items:center; gap:10px; min-height:60px; }
  .transcript { font-size:13px; color:var(--text-dim); letter-spacing:1px; text-align:center; font-style:italic; min-height:18px; }
  .response-box { background:rgba(0,212,255,0.04); border:1px solid rgba(0,212,255,0.12); border-radius:4px; padding:14px 18px; width:100%; font-size:14px; line-height:1.7; color:var(--text); max-height:140px; overflow-y:auto; display:none; }
  .response-box.visible { display:block; }
  .bottom-controls { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:10px; width:88%; max-width:420px; z-index:10; }
  .text-input-row { display:flex; width:100%; gap:8px; }
  .text-input { flex:1; background:rgba(0,212,255,0.05); border:1px solid rgba(0,212,255,0.2); border-radius:4px; padding:12px 14px; color:var(--text); font-family:'Rajdhani',sans-serif; font-size:14px; outline:none; }
  .text-input:focus { border-color:var(--blue); }
  .text-input::placeholder { color:var(--text-dim); }
  .send-btn { background:rgba(0,212,255,0.1); border:1px solid var(--blue); color:var(--blue); font-size:18px; width:48px; height:48px; border-radius:4px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .mic-row { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .mic-btn { width:64px; height:64px; border-radius:50%; border:2px solid var(--blue); background:rgba(0,212,255,0.06); color:var(--blue); font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; box-shadow:0 0 20px rgba(0,212,255,0.2); user-select:none; -webkit-user-select:none; touch-action:none; }
  .mic-btn.active { background:rgba(0,255,170,0.12); border-color:#00ffaa; box-shadow:0 0 30px rgba(0,255,170,0.4); color:#00ffaa; }
  .mic-hint { font-family:'Orbitron',monospace; font-size:8px; letter-spacing:2px; color:var(--text-dim); }
  .api-setup { position:fixed; inset:0; background:rgba(3,10,15,0.97); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:32px; }
  .api-setup.hidden { display:none; }
  .api-setup h2 { font-family:'Orbitron',monospace; font-size:18px; letter-spacing:4px; color:var(--blue); text-shadow:0 0 20px var(--blue-glow); }
  .api-setup p { font-size:13px; color:var(--text-dim); text-align:center; line-height:1.6; max-width:320px; letter-spacing:0.5px; }
  .api-setup a { color:var(--blue); }
  .api-input { width:100%; max-width:360px; background:rgba(0,212,255,0.05); border:1px solid rgba(0,212,255,0.2); border-radius:4px; padding:14px 16px; color:var(--text); font-family:'Rajdhani',sans-serif; font-size:14px; letter-spacing:1px; outline:none; }
  .btn-activate { background:transparent; border:1px solid var(--blue); color:var(--blue); font-family:'Orbitron',monospace; font-size:11px; letter-spacing:3px; padding:14px 32px; cursor:pointer; }
</style>
</head>
<body>
<div class="api-setup" id="apiSetup">
  <h2>JARVIS INIT</h2>
  <p>Enter your Anthropic API key.<br>Get yours at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a></p>
  <input class="api-input" id="apiKeyInput" type="password" placeholder="sk-ant-..." autocomplete="off"/>
  <p style="font-size:11px;color:rgba(0,212,255,0.3);">Stored locally on your device only.</p>
  <button class="btn-activate" onclick="activateJarvis()">ACTIVATE</button>
</div>
<div class="corner-tl"></div><div class="corner-tr"></div>
<div class="corner-bl"></div><div class="corner-br"></div>
<div class="hud-top">
  <div class="hud-corner"><span class="hud-label">System</span><span class="hud-value" id="hudStatus">STANDBY</span></div>
  <div class="hud-corner" style="align-items:flex-end"><span class="hud-label">Neural Core</span><span class="hud-value">CLAUDE</span></div>
</div>
<div id="app">
  <div class="waveform" id="waveform">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>
  <div class="orb-wrapper">
    <div class="orb-ring-outer"></div>
    <div class="orb-ring-mid"></div>
    <div class="orb-glow" id="orbGlow"></div>
    <div class="orb-core">
      <span class="orb-name">JARVIS</span>
      <span class="orb-status" id="orbStatus">ONLINE</span>
    </div>
  </div>
  <div class="chat-area">
    <div class="transcript" id="transcript">Hold 🎙 to speak — or type below</div>
    <div class="response-box" id="responseBox"></div>
  </div>
</div>
<div class="bottom-controls">
  <div class="text-input-row">
    <input class="text-input" id="textInput" type="text" placeholder="Type to JARVIS..."/>
    <button class="send-btn" onclick="sendText()">➤</button>
  </div>
  <div class="mic-row">
    <button class="mic-btn" id="micBtn"
      ontouchstart="startListening(event)" ontouchend="stopListening(event)"
      onmousedown="startListening(event)" onmouseup="stopListening(event)">🎙️</button>
    <span class="mic-hint">HOLD TO SPEAK</span>
  </div>
</div>
<script>
  let apiKey = localStorage.getItem('jarvis_api_key') || '';
  let recognition = null, isListening = false, conversationHistory = [];
  const SYSTEM = `You are JARVIS, a highly intelligent personal AI assistant. Sharp, direct, confident like Tony Stark's AI. Help with investing, building, making money, automating tasks. Be concise and powerful. Occasionally call the user "sir".`;
  if (apiKey) document.getElementById('apiSetup').classList.add('hidden');
  document.getElementById('textInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });
  function activateJarvis() {
    const k = document.getElementById('apiKeyInput').value.trim();
    if (!k.startsWith('sk-')) { alert('Enter a valid key starting with sk-'); return; }
    apiKey = k; localStorage.setItem('jarvis_api_key', k);
    document.getElementById('apiSetup').classList.add('hidden'); setStatus('ONLINE','idle');
  }
  function setStatus(label, mode) {
    document.getElementById('orbStatus').textContent = label;
    document.getElementById('orbStatus').className = 'orb-status ' + mode;
    document.getElementById('orbGlow').className = 'orb-glow ' + mode;
    document.getElementById('hudStatus').textContent = label;
    document.getElementById('waveform').className = (mode==='listening'||mode==='speaking') ? 'waveform active '+mode : 'waveform';
    mode==='listening' ? document.getElementById('micBtn').classList.add('active') : document.getElementById('micBtn').classList.remove('active');
  }
  function startListening(e) {
    e.preventDefault();
    if (!apiKey) { document.getElementById('apiSetup').classList.remove('hidden'); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { document.getElementById('transcript').textContent = 'Voice not supported — please type.'; return; }
    if (isListening) return;
    isListening = true; recognition = new SR();
    recognition.lang = 'en-US'; recognition.interimResults = true; recognition.continuous = true;
    recognition.onstart = () => { setStatus('LISTENING','listening'); document.getElementById('transcript').textContent = '...'; document.getElementById('responseBox').classList.remove('visible'); };
    recognition.onresult = (ev) => { document.getElementById('transcript').textContent = Array.from(ev.results).map(r => r[0].transcript).join(''); };
    recognition.onerror = (ev) => { document.getElementById('transcript').textContent = ev.error==='not-allowed' ? 'Mic blocked — allow in browser settings.' : 'Error: '+ev.error+'. Type instead.'; setStatus('ONLINE','idle'); isListening=false; };
    recognition.start();
  }
  function stopListening(e) {
    e.preventDefault();
    if (!isListening||!recognition) return;
    isListening=false; recognition.stop();
    setTimeout(() => { const t=document.getElementById('transcript').textContent.trim(); if(t&&!['...','Mic','Error','Hold','Voice'].some(s=>t.startsWith(s))) askJarvis(t); else setStatus('ONLINE','idle'); }, 400);
  }
  function sendText() {
    const el=document.getElementById('textInput'), text=el.value.trim();
    if (!text) return;
    if (!apiKey) { document.getElementById('apiSetup').classList.remove('hidden'); return; }
    el.value=''; document.getElementById('transcript').textContent=text; document.getElementById('responseBox').classList.remove('visible'); askJarvis(text);
  }
  async function askJarvis(text) {
    setStatus('THINKING','speaking'); conversationHistory.push({role:'user',content:text});
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}, body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,system:SYSTEM,messages:conversationHistory}) });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const reply = data.content[0].text;
      conversationHistory.push({role:'assistant',content:reply});
      document.getElementById('responseBox').textContent=reply; document.getElementById('responseBox').classList.add('visible'); speak(reply);
    } catch(err) { setStatus('ERROR','idle'); document.getElementById('transcript').textContent='Error: '+err.message; }
  }
  function speak(text) {
    if (!window.speechSynthesis) { setStatus('ONLINE','idle'); return; }
    speechSynthesis.cancel(); setStatus('SPEAKING','speaking');
    const u=new SpeechSynthesisUtterance(text); u.rate=1.05; u.pitch=0.85; u.volume=1;
    const v=speechSynthesis.getVoices(), preferred=v.find(x=>x.name.includes('Daniel')||x.name.includes('Google UK English Male')||x.name.includes('Alex'));
    if (preferred) u.voice=preferred; u.onend=()=>setStatus('ONLINE','idle'); speechSynthesis.speak(u);
  }
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
</script>
</body>
</html>
